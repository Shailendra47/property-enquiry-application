<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule a Meeting | Profilent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/style.css?v=20261014-schedule" rel="stylesheet">
  <style>
    .schedule-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      position: relative;
      z-index: 2;
    }
    .schedule-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .schedule-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .redirect-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .spinner-wa {
      width: 50px;
      height: 50px;
      border: 5px solid #e0e0e0;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .wa-btn {
      background: #25d366;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }
    .wa-btn:hover {
      background: #1ebc59;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="schedule-container">
    <div class="schedule-header">
      <p class="kicker text-uppercase fw-bold text-muted small mb-1">Meet Our Property Team</p>
      <h1 class="h2 fw-bold mb-2">Schedule Your Consultation</h1>
      <p class="text-muted mb-0">Select your preferred date and time. After booking, we’ll send the meeting details to the WhatsApp number linked to your enquiry when available.</p>
    </div>

    <div class="schedule-card">
      <!-- Calendly inline widget begin -->
      <div class="calendly-inline-widget" data-url="https://calendly.com/shailendra-profilent/30min?hide_landing_page_details=1&hide_gdpr_banner=1" style="min-width:320px;height:720px;"></div>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
      <!-- Calendly inline widget end -->
    </div>
  </main>

  <!-- Booking confirmation status -->
  <div id="redirectOverlay" class="redirect-overlay" style="display: none;">
    <div class="spinner-wa"></div>
    <h3 class="fw-bold mb-2">Meeting Scheduled!</h3>
    <p class="text-muted mb-3" id="redirectStatus">Checking WhatsApp confirmation status...</p>
    <a href="/" class="wa-btn">Return to Profilent</a>
  </div>

  <script>
    function isCalendlyEvent(e) {
      return e.origin === "https://calendly.com" && e.data && e.data.event && e.data.event.indexOf("calendly.") === 0;
    }

    let bookingConfirmationStarted = false;
    window.addEventListener("message", async function(e) {
      if (!isCalendlyEvent(e)) return;

      if (e.data.event === "calendly.event_scheduled" && !bookingConfirmationStarted) {
        bookingConfirmationStarted = true;
        console.log("Calendly event scheduled:", e.data.payload);
        const overlay = document.getElementById("redirectOverlay");
        overlay.style.display = "flex";

        const payload = e.data.payload || {};
        const eventUri = payload.event && payload.event.uri ? encodeURIComponent(payload.event.uri) : "";
        const inviteeUri = payload.invitee && payload.invitee.uri ? encodeURIComponent(payload.invitee.uri) : "";

        try {
          if (!eventUri || !inviteeUri) throw new Error("Calendly did not provide booking references.");
          const response = await fetch("/api/calendly/booking-confirmation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ event_uri: decodeURIComponent(eventUri), invitee_uri: decodeURIComponent(inviteeUri) })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "Booking confirmation could not be sent.");

          const status = document.getElementById("redirectStatus");
          if (result.duplicate) {
            status.textContent = "Your booking is confirmed. A WhatsApp confirmation for this booking is already being processed.";
          } else if (result.notification_status === "queued") {
            status.textContent = "Your booking is confirmed. A WhatsApp confirmation is queued for the number linked to your enquiry.";
          } else if (result.notification_status === "not_opted_in") {
            status.textContent = "Your booking is confirmed. WhatsApp confirmation needs your opt-in; Calendly will email the invitation.";
          } else if (result.notification_status === "unmatched") {
            status.textContent = "Your booking is confirmed, but we couldn't match it to an enquiry by email or phone. Calendly will email the invitation.";
          } else if (result.notification_status === "missing_phone") {
            status.textContent = "Your booking is confirmed, but no WhatsApp number was found on your enquiry. Calendly will email the invitation.";
          } else if (result.notification_status === "template_not_configured") {
            status.textContent = "Your booking is confirmed, but WhatsApp confirmation isn't configured yet. Calendly will email the invitation.";
          } else if (result.notification_status === "opted_out") {
            status.textContent = "Your booking is confirmed. WhatsApp messages are turned off for this number; Calendly will email the invitation.";
          } else {
            status.textContent = "Your booking is confirmed. Calendly will email the invitation.";
          }
        } catch (err) {
          console.error("Calendly WhatsApp fallback failed:", err);
          document.getElementById("redirectStatus").textContent =
            "Your booking is confirmed, but we couldn't check WhatsApp delivery. Calendly will email the invitation.";
        }
      }
    });
  </script>
</body>
</html>
