<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule a Meeting | Profilent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/style.css?v=20261022-schedule-layout" rel="stylesheet">
  <style>
    html, body.schedule-page { width: 100%; height: 100%; min-height: 100%; overflow: hidden; }
    .schedule-page { background: #fbfcfe; }
    .schedule-navbar { position: relative; z-index: 1; display: flex; align-items: center; height: 78px; padding: 0 clamp(20px, 3.1vw, 60px); background: rgba(255,255,255,.97); border-bottom: 1px solid #e8eef3; }
    .schedule-brand { display: inline-flex; align-items: center; gap: 8px; color: #14263d; text-decoration: none; }
    .schedule-brand-mark { width: 34px; height: 40px; }
    .schedule-brand-copy { display: grid; line-height: 1; }
    .schedule-brand-name { font-size: 1.65rem; font-weight: 800; letter-spacing: -.045em; }
    .schedule-brand-tagline { margin-top: 3px; text-align: center; font-size: .48rem; letter-spacing: .05em; }
    .schedule-container {
      width: min(1500px, calc(100% - 48px));
      height: calc(100dvh - 78px);
      margin: 0 auto;
      padding: 14px 0;
      position: relative;
      z-index: 2;
    }
    .schedule-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .schedule-card .calendly-inline-widget { width: 100%; min-width: 320px; height: 100%; }
    .redirect-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .spinner-wa {
      width: 50px;
      height: 50px;
      border: 5px solid #e0e0e0;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .wa-btn {
      background: #25d366;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }
    .wa-btn:hover {
      background: #1ebc59;
      color: #fff;
    }
    @media (max-width: 640px) {
      html, body.schedule-page { height: auto; min-height: 100%; overflow-y: auto; }
      .schedule-navbar { height: 68px; padding: 0 16px; }
      .schedule-brand-name { font-size: 1.4rem; }
      .schedule-container { width: 100%; height: auto; padding: 10px 0; }
      .schedule-card { height: 78vh; min-height: 680px; border-radius: 0; }
      .schedule-card .calendly-inline-widget { height: 100%; }
    }
  </style>
</head>
<body class="schedule-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <header class="schedule-navbar">
    <a class="schedule-brand" href="/" aria-label="Profilent home">
      <svg class="schedule-brand-mark" viewBox="0 0 32 38" aria-hidden="true">
        <path d="M2 2h12v34H2z" fill="#8ad8d8"></path>
        <path d="M14 2h7a13 13 0 0 1 0 26h-7z" fill="#0bb8bd"></path>
        <path d="M2 31h12v5H2z" fill="#bfe9e8"></path>
      </svg>
      <span class="schedule-brand-copy"><span class="schedule-brand-name">PROFILENT</span><span class="schedule-brand-tagline">NURTURING TRUST</span></span>
    </a>
  </header>

  <main class="schedule-container">
    <div class="schedule-card">
      <!-- Calendly inline widget begin -->
      <div class="calendly-inline-widget" data-url="https://calendly.com/shailendra-profilent/30min?hide_landing_page_details=1&hide_gdpr_banner=1"></div>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
      <!-- Calendly inline widget end -->
    </div>
  </main>

  <!-- Booking confirmation status -->
  <div id="redirectOverlay" class="redirect-overlay" style="display: none;">
    <div class="spinner-wa"></div>
    <h3 class="fw-bold mb-2">Meeting Scheduled!</h3>
    <p class="text-muted mb-3" id="redirectStatus">Checking WhatsApp confirmation status...</p>
    <p class="small text-muted mb-0" id="returnCountdown" aria-live="polite"></p>
    <a href="/#contactForm" class="wa-btn">Return to Contact Us</a>
  </div>

  <script>
    let contactFormReturnTimer = null;

    function returnToContactFormAutomatically() {
      if (contactFormReturnTimer) return;
      const countdown = document.getElementById("returnCountdown");
      let secondsLeft = 5;
      countdown.textContent = `Returning to the Contact Us form in ${secondsLeft} seconds...`;
      contactFormReturnTimer = window.setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          window.clearInterval(contactFormReturnTimer);
          window.location.assign("/#contactForm");
          return;
        }
        countdown.textContent = `Returning to the Contact Us form in ${secondsLeft} seconds...`;
      }, 1000);
    }

    function isCalendlyEvent(e) {
      return e.origin === "https://calendly.com" && e.data && e.data.event && e.data.event.indexOf("calendly.") === 0;
    }

    let bookingConfirmationStarted = false;
    window.addEventListener("message", async function(e) {
      if (!isCalendlyEvent(e)) return;

      if (e.data.event === "calendly.event_scheduled" && !bookingConfirmationStarted) {
        bookingConfirmationStarted = true;
        const overlay = document.getElementById("redirectOverlay");
        overlay.style.display = "flex";

        const payload = e.data.payload || {};
        const eventUri = payload.event && payload.event.uri ? encodeURIComponent(payload.event.uri) : "";
        const inviteeUri = payload.invitee && payload.invitee.uri ? encodeURIComponent(payload.invitee.uri) : "";

        try {
          if (!eventUri || !inviteeUri) throw new Error("Calendly did not provide booking references.");
          const response = await fetch("/api/calendly/booking-confirmation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ event_uri: decodeURIComponent(eventUri), invitee_uri: decodeURIComponent(inviteeUri) })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "Booking confirmation could not be sent.");

          const status = document.getElementById("redirectStatus");
          if (result.duplicate) {
            status.textContent = "Your booking is confirmed. The WhatsApp meeting confirmation is already being processed.";
          } else if (result.notification_status === "queued") {
            status.textContent = "Your booking is confirmed. The meeting details template is being sent to the WhatsApp number linked to your enquiry.";
          } else if (result.notification_status === "not_opted_in") {
            status.textContent = "Your booking is confirmed. WhatsApp confirmation needs your opt-in; Calendly will email the invitation.";
          } else if (result.notification_status === "unmatched") {
            status.textContent = "Your booking is confirmed, but we couldn't match it to an enquiry by email or phone. Calendly will email the invitation.";
          } else if (result.notification_status === "missing_phone") {
            status.textContent = "Your booking is confirmed, but no WhatsApp number was found on your enquiry. Calendly will email the invitation.";
          } else if (result.notification_status === "template_not_configured") {
            status.textContent = "Your booking is confirmed, but WhatsApp confirmation isn't configured yet. Calendly will email the invitation.";
          } else if (result.notification_status === "opted_out") {
            status.textContent = "Your booking is confirmed. WhatsApp messages are turned off for this number; Calendly will email the invitation.";
          } else {
            status.textContent = "Your booking is confirmed. Calendly will email the invitation.";
          }
          returnToContactFormAutomatically();
        } catch (err) {
          console.error("Calendly WhatsApp fallback failed:", err);
          document.getElementById("redirectStatus").textContent =
            "Your booking is confirmed. We couldn't confirm the WhatsApp notification; Calendly will email your invitation.";
          returnToContactFormAutomatically();
        }
      }
    });
  </script>
</body>
</html>
